name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-win-x64
          path: build/launcher.exe
          if-no-files-found: error

  test-windows:
    needs: build-windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v7
        with:
          name: launcher-win-x64
          path: built
      - name: Integration tests
        shell: pwsh
        timeout-minutes: 5
        run: ./test/integration.ps1 -Launcher (Resolve-Path built/launcher.exe) -JavaHome $env:JAVA_HOME
