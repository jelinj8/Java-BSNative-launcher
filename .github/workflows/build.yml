name: Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-win-x64
          path: build/launcher.exe
          if-no-files-found: error

  test-windows:
    needs: build-windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v7
        with:
          name: launcher-win-x64
          path: built
      - name: Integration tests
        shell: pwsh
        timeout-minutes: 5
        run: ./test/integration.ps1 -Launcher (Resolve-Path built/launcher.exe) -JavaHome $env:JAVA_HOME

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches pom.xml
        run: |
          revision=$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' pom.xml)
          if [ "v$revision" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pom.xml revision $revision"
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          name: launcher-win-x64
          path: built
      - name: Prepare files
        run: |
          mkdir dist
          cp built/launcher.exe dist/bsnative-launcher-win-x64.exe
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
