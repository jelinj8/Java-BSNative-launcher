name: Build

# Platforms use the names of javacpp.platform, so a Maven build can select its launcher by that.

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

jobs:
  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-windows-x86_64
          path: build/launcher.exe
          if-no-files-found: error

  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
      - name: Build
        shell: msys2 {0}
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-windows-arm64
          path: build/launcher.exe
          if-no-files-found: error

  # Built in an older distribution, so the binary also runs on older systems. glibc is backward
  # compatible only: a binary built on a newer system refuses to start on an older one.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" -v "$JAVA_HOME:/jdk:ro" -w /src -e JAVA_HOME=/jdk almalinux:8 sh -c '
            dnf install -y -q gcc glibc-devel make cmake > /dev/null &&
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build &&
            ctest --test-dir build --output-on-failure &&
            chmod -R a+rwX build'
      - name: Show the newest glibc it needs
        run: objdump -T build/launcher | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-${{ matrix.name }}
          path: build/launcher
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macosx-arm64
            runner: macos-15
          - name: macosx-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-${{ matrix.name }}
          path: build/launcher
          if-no-files-found: error

  test:
    needs: [build-windows-x86_64, build-windows-arm64, build-linux, build-macos]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            runner: windows-latest
            file: launcher.exe
          - name: linux-x86_64
            runner: ubuntu-24.04
            file: launcher
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            file: launcher
          - name: macosx-arm64
            runner: macos-15
            file: launcher
          - name: macosx-x86_64
            runner: macos-15-intel
            file: launcher
        java: ['11', '21', '25']
        include:
          # Temurin has no JDK 25 for Windows ARM64
          - java: '21'
            platform:
              name: windows-arm64
              runner: windows-11-arm
              file: launcher.exe
    name: test (${{ matrix.platform.name }}, ${{ matrix.java }})
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v7
        with:
          name: launcher-${{ matrix.platform.name }}
          path: built
      - name: Integration tests
        shell: pwsh
        timeout-minutes: 5
        env:
          LC_ALL: C.UTF-8
        run: ./test/integration.ps1 -Launcher (Resolve-Path built/${{ matrix.platform.file }}) -JavaHome $env:JAVA_HOME

  maven-plugin:
    needs: [build-windows-x86_64, build-windows-arm64, build-linux, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v7
        with:
          path: built
      - name: Collect the binaries, as a release does
        run: |
          mkdir dist
          for platform in windows-x86_64 windows-arm64; do
            cp "built/launcher-$platform/launcher.exe" "dist/bsnative-launcher-$platform.exe"
          done
          for platform in linux-x86_64 linux-arm64 macosx-x86_64 macosx-arm64; do
            cp "built/launcher-$platform/launcher" "dist/bsnative-launcher-$platform"
          done
      - name: Build and test the plugin
        run: mvn -B -ntp verify

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, maven-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches pom.xml
        run: |
          revision=$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' pom.xml)
          if [ "v$revision" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pom.xml revision $revision"
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          path: built
      - name: Prepare files
        run: |
          mkdir dist
          for platform in windows-x86_64 windows-arm64; do
            cp "built/launcher-$platform/launcher.exe" "dist/bsnative-launcher-$platform.exe"
          done
          for platform in linux-x86_64 linux-arm64 macosx-x86_64 macosx-arm64; do
            cp "built/launcher-$platform/launcher" "dist/bsnative-launcher-$platform"
          done
          chmod +x dist/bsnative-launcher-linux-* dist/bsnative-launcher-macosx-*
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
